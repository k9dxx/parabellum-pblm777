    <div class="container">
        <h2>UTILITÁRIOS DE OPERAÇÃO</h2>
        <div class="card">
            <h3>Gerador de Senha Segura</h3>
            <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 15px;">Gere chaves randômicas com caracteres especiais.</p>
            <input type="text" id="pass-output" readonly placeholder="Clique no botão para gerar">
            <button class="btn" onclick="generatePass()">Gerar Chave</button>
        </div>
    </div>

    <script>
        function generatePass() {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+-=";
            let pass = "";
            for (let i = 0; i < 16; i++) {
                pass += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById('pass-output').value = pass;
        }
    </script>
